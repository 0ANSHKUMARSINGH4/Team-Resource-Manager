# ===============================
# SERVER CONFIGURATION
# ===============================
# This line is CRITICAL for Deployment.
# It tells the app: "Use the port Render gives you, otherwise use 8080 locally."
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION (H2 - In-Memory)
# ===============================
# Uses an in-memory database (fastest for interviews/demos)
spring.datasource.url=jdbc:h2:mem:teamdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# H2 CONSOLE (For Viewing Data)
# ===============================
# Enables the browser console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allows the console to be accessed from the browser
spring.h2.console.settings.web-allow-others=true

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# Automatically creates tables from your Java "Employee" class
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in your IntelliJ console (great for debugging)
spring.jpa.show-sql=true
# Formats the SQL nicely in the logs
spring.jpa.properties.hibernate.format_sql=true

