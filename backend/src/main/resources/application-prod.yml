spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trmdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:trm}
    password: ${DATABASE_PASSWORD:trm}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
